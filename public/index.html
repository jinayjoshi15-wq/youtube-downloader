<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Inter", "sans-serif"]
                    }
                }
            }
        };
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #1e293b;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .btn-primary {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            transition: all 0.3s ease;
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #0891b2 0%, #0e7490 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(6, 182, 212, 0.4);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-field {
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
        }

        .format-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .format-card:hover {
            border-color: #64748b;
            transform: translateY(-2px);
        }

        .format-card.selected {
            border-color: #06b6d4;
            background: rgba(6, 182, 212, 0.1);
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.2);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            border: 3px solid #475569;
            border-top-color: #06b6d4;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.6s linear infinite;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        select {
            transition: all 0.3s ease;
        }

        select:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-12">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-5xl font-bold text-white mb-3 tracking-tight">YouTube Downloader</h1>
            <p class="text-slate-300 text-lg">Download videos and audio in high quality</p>
        </header>

        <!-- Input Section -->
        <section id="step-input" class="mb-8">
            <div class="bg-slate-800 rounded-xl border border-slate-700 p-6 shadow-2xl">
                <label for="urlInput" class="block text-sm font-medium text-slate-200 mb-2">Video URL</label>
                <div class="flex gap-3">
                    <input
                        type="url"
                        id="urlInput"
                        placeholder="https://youtube.com/watch?v=..."
                        class="input-field flex-1 px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 text-base"
                        autocomplete="off"
                    >
                    <button id="btnAnalyze" class="btn-primary px-6 py-3 rounded-lg font-semibold text-white flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        Analyze
                    </button>
                </div>
                <p id="inputError" class="text-red-400 text-sm mt-2 min-h-[20px]"></p>
            </div>
        </section>

        <!-- Options Section -->
        <section id="step-options" class="hidden">
            <!-- Video Info -->
            <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden mb-6 shadow-2xl">
                <div class="relative aspect-video bg-slate-900">
                    <img id="thumbImg" src="" alt="Video Thumbnail" class="w-full h-full object-cover">
                    <div id="thumbLoader" class="absolute inset-0 flex items-center justify-center bg-slate-900">
                        <div class="spinner"></div>
                    </div>
                    <div id="durationBadge" class="absolute bottom-3 right-3 bg-black/90 backdrop-blur text-white text-xs font-semibold px-3 py-1.5 rounded hidden"></div>
                </div>
                <div class="p-6">
                    <h2 id="videoTitle" class="text-xl font-semibold text-white mb-2"></h2>
                    <div class="flex items-center gap-4 text-sm text-slate-300">
                        <span id="uploaderInfo"></span>
                        <span id="durationInfo" class="hidden"></span>
                    </div>
                </div>
            </div>

            <!-- Format & Quality Selection -->
            <div class="bg-slate-800 rounded-xl border border-slate-700 p-6 shadow-2xl mb-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <!-- Format Selection -->
                    <div>
                        <label class="block text-sm font-medium text-slate-200 mb-3">Format</label>
                        <div class="grid grid-cols-2 gap-3">
                            <button data-format="mp4" class="format-card p-4 rounded-lg border border-slate-600 bg-slate-700 selected">
                                <svg class="w-8 h-8 text-cyan-400 mx-auto mb-2" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v12h16V6H4z"/>
                                </svg>
                                <div class="font-semibold text-white text-sm">Video</div>
                                <div class="text-xs text-slate-300">MP4</div>
                            </button>
                            <button data-format="mp3" class="format-card p-4 rounded-lg border border-slate-600 bg-slate-700">
                                <svg class="w-8 h-8 text-cyan-400 mx-auto mb-2" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                                </svg>
                                <div class="font-semibold text-white text-sm">Audio</div>
                                <div class="text-xs text-slate-300">MP3</div>
                            </button>
                        </div>
                    </div>

                    <!-- Quality Selection -->
                    <div>
                        <label for="qualitySelect" class="block text-sm font-medium text-slate-200 mb-3">Quality</label>
                        <select id="qualitySelect" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white text-base" disabled>
                            <option value="">Analyze a video first</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Download Button -->
            <button id="btnDownload" class="btn-primary w-full py-4 rounded-lg font-semibold text-white text-lg flex items-center justify-center gap-2" disabled>
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                <span id="btnDownloadText">Download</span>
                <div id="btnSpinner" class="spinner hidden"></div>
            </button>

            <!-- Progress Bar -->
            <div id="progressContainer" class="hidden mt-4 bg-slate-800 rounded-lg p-4 border border-slate-700">
                <div class="flex justify-between text-sm text-slate-300 mb-2">
                    <span id="progressPercent">0%</span>
                    <span id="progressSpeed">--</span>
                </div>
                <div class="w-full bg-slate-700 rounded-full h-3 overflow-hidden">
                    <div id="progressBar" class="h-full bg-gradient-to-r from-cyan-500 to-cyan-400 transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <p id="downloadError" class="text-red-400 text-sm text-center mt-3 min-h-[20px]"></p>

            <!-- Fast Download Command -->
            <div class="bg-slate-800 rounded-xl border border-slate-700 p-6 mt-6">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-slate-200 font-semibold">⚡ Faster Download (CLI)</h3>
                    <span class="text-xs text-slate-400">Direct download, no proxy</span>
                </div>
                <div class="bg-slate-900 rounded-lg p-3 font-mono text-sm text-slate-300 break-all" id="commandBox">
                    Select quality and click "Copy Command"
                </div>
                <button id="btnCopyCommand" class="mt-3 w-full py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-white font-medium transition" disabled>
                    📋 Copy Command
                </button>
                <p class="text-xs text-slate-400 mt-2">Paste in terminal for full-speed download</p>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
